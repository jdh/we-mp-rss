# 云服务器部署配置
version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.3.0
    container_name: we-mp-rss-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-we_mp_rss}
      MYSQL_USER: ${MYSQL_USER:-rss_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pass123456}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_buffer_pool_size=256M
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 主应用
  we-mp-rss:
    image: we-mp-rss:latest
    container_name: we-mp-rss
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB: mysql+pymysql://${MYSQL_USER:-rss_user}:${MYSQL_PASSWORD:-pass123456}@mysql/${MYSQL_DATABASE:-we_mp_rss}?charset=utf8mb4
      USERNAME: ${USERNAME:-admin}
      PASSWORD: ${PASSWORD:-admin@123}
      AUTO_RELOAD: ${AUTO_RELOAD:-False}
    ports:
      - "${WEB_PORT:-8001}:8001"
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/wx/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
